version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: voxaflow-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=voxaflow

  redis:
    image: redis:7.2-alpine
    container_name: voxaflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: voxaflow-api-gateway
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/voxaflow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=voxaflow_jwt_super_secret_key_2026
      - REFRESH_SECRET=voxaflow_refresh_super_secret_key_2026
      - AI_SERVICE_URL=http://ai-orchestrator:8000
    depends_on:
      - mongodb
      - redis

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: voxaflow-ai-orchestrator
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - API_GATEWAY_URL=http://api-gateway:5000

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: voxaflow-web
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  redis_data:
